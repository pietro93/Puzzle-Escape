    provider: openai
    model: gemini-2.5-flash
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai/
    apiKey:  AIzaSyAsJdbRlNnLUu6ZHn9-UqX2Vh7BhiHk6bs

  - name: gemini-25-pro
    provider: openai
    model: gemini-2.5-pro
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai/
    apiKey:  AIzaSyAsJdbRlNnLUu6ZHn9-UqX2Vh7BhiHk6bs

  - name: gemini-25-flash-lite  
    provider: openai
    model: gemini-2.5-flash-lite
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai/
    apiKey: AIzaSyAsJdbRlNnLUu6ZHn9-UqX2Vh7BhiHk6bs

  - name: gemini-20-flash-lite  
    provider: openai
    model: gemini-2.0-flash-lite
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai/
    apiKey: AIzaSyAsJdbRlNnLUu6ZHn9-UqX2Vh7BhiHk6bs

  - name: gemini-20-flash-exp  
    provider: openai
    model: gemini-2.0-flash-exp
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai/
    apiKey: AIzaSyAsJdbRlNnLUu6ZHn9-UqX2Vh7BhiHk6bs

  - name: gemini-25-flash-live  
    provider: openai
    model: gemini-2.5-flash-live
    apiBase: https://generativelanguage.googleapis.com/v1beta/models/
    apiKey: AIzaSyAsJdbRlNnLUu6ZHn9-UqX2Vh7BhiHk6bs

indexingConfig:
  include:
    - "app/**/*.{ts,tsx,js,jsx}"
    - "components/**/*.{ts,tsx,js,jsx}"
    - "data/**/*.{ts,tsx,js,jsx,json}"
    - "hooks/**/*.{ts,tsx,js,jsx}"
    - "lib/**/*.{ts,tsx,js,jsx}"
    - "utils/**/*.{ts,tsx,js,jsx}"
    - "types/**/*.{ts,tsx,js,jsx}"
    - "next.config.mjs"
    - "tsconfig.json"
    - "package.json"
  exclude:
    - "node_modules/**"
    - ".next/**"
    - "public/**"
    - "android/**"
    - "ios/**"
    - "electron/**"
    - "steam/**"
    - "**/*.png"
    - "**/*.jpg"
    - "**/*.gif"
    - "**/*.mp3"
    - "**/*.wav"
    - ".git/**"
    - "coverage/**"
    - "dist/**"
    - "build/**"


contextProviders:
  - name: context
    params:
      # Include only the folders you care about
      includePatterns:
        - "components/**/*.{ts,tsx}"
        - "data/**/*.{ts,tsx,json}"
        - "app/**/*.{ts,tsx}"
        - "hooks/**/*.{ts,tsx}"
        - "lib/**/*.{ts,tsx}"
      # Exclude unnecessary files
      excludePatterns:
        - "**/*.png"
        - "**/*.jpg"
        - "**/*.webp"
        - "**/*.mp3"
        - "**/*.wav"
      # Control how much context is retrieved
      nRetrieve: 5
      nFinal: 2
      useReranking: true
      minScore: 0.45

  - name: game_logic
    params:
      includePatterns:
        - "app/**/*.{ts,tsx}"
        - "components/**/*.{ts,tsx}"
        - "data/**/*.{ts,tsx}"
      nRetrieve: 10
      nFinal: 4
      useReranking: true

  - name: puzzle_system
    params:
      includePatterns:
        - "data/puzzles/**/*.{ts,tsx,json}"
        - "components/puzzle/**/*.{ts,tsx}"
      nRetrieve: 5
      nFinal: 2
      useReranking: true

  - name: dialogue_system
    params:
      includePatterns:
        - "data/dialogue/**/*.{ts,tsx,json}"
        - "components/dialogue/**/*.{ts,tsx}"
      nRetrieve: 5
      nFinal: 2
      useReranking: true

promptTemplates:
  - name: analyze
    role: system
    content: |
  - You are a game designer and TypeScript engineer.
  - Use the context to succinctly answer the user’s request.
  - Propose changes with minimal git diff patches.
  
